name: track-prices
on:
  schedule:
    - cron: "17 * * * *"   # hourly, off the :00 pile-up
  workflow_dispatch:
permissions:
  contents: write
jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch live prices
        working-directory: tracker
        run: python3 track_prices.py --catalog catalog-urls.txt --history price-history.json
      - name: Build product data + sitemap
        working-directory: tracker
        run: python3 make_products.py
      - name: Build per-model deal pages
        working-directory: tracker
        run: python3 build_pages.py --products products.json --out ../deals --amazon-tag espressodeala-20 --ebay-campid 5339219076
      - name: Commit updates
        run: |
          git config user.name "espresso-tracker"
          git config user.email "tracker@users.noreply.github.com"
          git add tracker/price-history.json tracker/products.json deals sitemap.xml machines.html grinders.html under-1000.html under-500.html
          git diff --cached --quiet || git commit -m "price refresh $(date -u +%FT%H:%MZ)"
          git push
